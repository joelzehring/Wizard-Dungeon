<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wizard Dungeon</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0c051a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            width: 100%;
            max-width: 800px;
            position: relative;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 5px;
            font-weight: bold;
            color: #a78bfa;
            font-size: 14px;
        }
        canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: 3px solid #4a2574;
            border-radius: 8px;
            box-shadow: 0 0 15px #8b5cf6;
            display: block;
        }
        #touchControls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding: 0 10px;
        }
        .d-pad, .action-pad {
            display: flex;
            gap: 12px;
        }
        .btn {
            width: 90px;
            height: 90px;
            background-color: rgba(139, 92, 246, 0.3);
            border: 2px solid #8b5cf6;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active {
            background-color: rgba(139, 92, 246, 0.7);
            transform: scale(0.95);
        }
        .btn-wide {
            width: 110px;
            background-color: rgba(6, 182, 212, 0.3);
            border-color: #06b6d4;
        }
        .btn-wide:active {
            background-color: rgba(6, 182, 212, 0.7);
        }
        @media (min-width: 768px) {
            #touchControls {
                display: none;
            }
            .header-ui::after {
                content: " | Controls: A/D to Move, W to Jump, Space to Cast Magic";
                font-size: 11px;
                color: #6d28d9;
            }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="header-ui">
        <span id="levelDisplay">Realm 1: Mystical Caves</span>
        <span id="objectiveDisplay">Crystals: <span id="scoreDisplay">0/3</span></span>
    </div>
    
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="touchControls">
        <div class="d-pad">
            <div class="btn" id="btnLeft" data-input="left">⬅️</div>
            <div class="btn" id="btnRight" data-input="right">➡️</div>
        </div>
        <div class="action-pad">
            <div class="btn btn-wide" id="btnMagic" data-input="magic">✨</div>
            <div class="btn" id="btnJump" data-input="jump">🔼</div>
        </div>
    </div>
</div>

<script type="module" src="./js/engine.js"></script>

</body>
</html>
