<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wizard Dungeon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="gameContainer">
    <div class="header-ui">
        <span id="levelDisplay">Realm 1: Mystical Caves</span>
        <span id="objectiveDisplay">Crystals: <span id="scoreDisplay">0/3</span></span>
    </div>
    
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="touchControls">
        <div class="d-pad">
            <div class="btn" id="btnLeft" data-input="left">⬅️</div>
            <div class="btn" id="btnRight" data-input="right">➡️</div>
        </div>
        <div class="action-pad">
            <div class="btn btn-wide" id="btnMagic" data-input="magic">✨</div>
            <div class="btn" id="btnJump" data-input="jump">🔼</div>
        </div>
    </div>
</div>
<script type="module" src="js/main.js"></script>

</body>
</html>
