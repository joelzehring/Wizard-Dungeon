<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wizard Dungeon</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0c051a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            width: 100%;
            max-width: 800px;
            position: relative;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 5px;
            font-weight: bold;
            color: #a78bfa;
            font-size: 14px;
        }
        canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: 3px solid #4a2574;
            border-radius: 8px;
            box-shadow: 0 0 15px #8b5cf6;
            display: block;
        }
        #touchControls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding: 0 10px;
        }
        .d-pad, .action-pad {
            display: flex;
            gap: 12px;
        }
        .btn {
            width: 60px;
            height: 60px;
            background-color: rgba(139, 92, 246, 0.3);
            border: 2px solid #8b5cf6;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active {
            background-color: rgba(139, 92, 246, 0.7);
            transform: scale(0.95);
        }
        .btn-wide {
            width: 70px;
            background-color: rgba(6, 182, 212, 0.3);
            border-color: #06b6d4;
        }
        .btn-wide:active {
            background-color: rgba(6, 182, 212, 0.7);
        }
        @media (min-width: 768px) {
            #touchControls {
                display: none;
            }
            .header-ui::after {
                content: " | Controls: A/D to Move, W to Jump, Space to Cast Magic";
                font-size: 11px;
                color: #6d28d9;
            }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="header-ui">
        <span id="levelDisplay">Realm 1: Mystical Caves</span>
        <span id="objectiveDisplay">Crystals: <span id="scoreDisplay">0/3</span></span>
    </div>
    
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="touchControls">
        <div class="d-pad">
            <div class="btn" id="btnLeft" data-input="left"></div>
            <div class="btn" id="btnRight" data-input="right"></div>
        </div>
        <div class="action-pad">
            <div class="btn btn-wide" id="btnMagic" data-input="magic"></div>
            <div class="btn" id="btnJump" data-input="jump"></div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreDisplay = document.getElementById("scoreDisplay");
const levelDisplay = document.getElementById("levelDisplay");
const objectiveDisplay = document.getElementById("objectiveDisplay");

// --- GAME PHYSICS CONFIG ---
const GRAVITY = 0.5;
const PLAYER_SPEED = 4.5;
const JUMP_FORCE = -11.5;

let currentLevelIndex = 0;
let score = 0;
let gameOver = false;
let gameWon = false;

const camera = { x: 0, width: canvas.width, height: canvas.height };
const inputs = { left: false, right: false, jump: false, magic: false };

// --- DATA DEFINITIONS FOR LEVELS ---
const levelData = [
    {
        name: "Realm 1: Mystical Caves",
        isBossLevel: false,
        bgGradient: ["#130b2b", "#25134a"],
        primaryColor: "#4c1d95",
        secondaryColor: "#2e1065",
        portalX: 2000, portalY: 300,
        platforms: [
            { x: 0, y: 400, width: 700, height: 50 },
            { x: 800, y: 400, width: 600, height: 50 },
            { x: 1500, y: 400, width: 800, height: 50 },
            { x: 250, y: 300, width: 150, height: 15 },
            { x: 500, y: 220, width: 150, height: 15 },
            { x: 1000, y: 280, width: 200, height: 15 },
            { x: 1300, y: 200, width: 150, height: 15 },
            { x: 1750, y: 300, width: 180, height: 15 }
        ],
        crystals: [
            { x: 320, y: 250, width: 16, height: 20, collected: false },
            { x: 570, y: 170, width: 16, height: 20, collected: false },
            { x: 1080, y: 220, width: 16, height: 20, collected: false }
        ],
        enemies: [
            { x: 400, y: 368, width: 24, height: 32, minX: 150, maxX: 650, speed: 1.5, alive: true },
            { x: 1100, y: 368, width: 24, height: 32, minX: 850, maxX: 1350, speed: 1.8, alive: true }
        ]
    },
    {
        name: "Realm 2: The Crystal Spires",
        isBossLevel: false,
        bgGradient: ["#051c24", "#083344"],
        primaryColor: "#0e7490",
        secondaryColor: "#155e75",
        portalX: 2100, portalY: 120,
        platforms: [
            { x: 0, y: 400, width: 400, height: 50 },
            { x: 500, y: 320, width: 300, height: 20 },
            { x: 900, y: 250, width: 250, height: 20 },
            { x: 1250, y: 350, width: 400, height: 50 },
            { x: 1750, y: 250, width: 200, height: 20 },
            { x: 2000, y: 180, width: 200, height: 20 },
            { x: 1200, y: 180, width: 300, height: 15 }
        ],
        crystals: [
            { x: 620, y: 270, width: 16, height: 20, collected: false },
            { x: 1000, y: 190, width: 16, height: 20, collected: false },
            { x: 1350, y: 130, width: 16, height: 20, collected: false },
            { x: 1850, y: 190, width: 16, height: 20, collected: false }
        ],
        enemies: [
            { x: 150, y: 368, width: 24, height: 32, minX: 50, maxX: 350, speed: 2.0, alive: true },
            { x: 600, y: 288, width: 24, height: 32, minX: 520, maxX: 760, speed: 1.5, alive: true },
            { x: 1350, y: 318, width: 24, height: 32, minX: 1260, maxX: 1600, speed: 2.2, alive: true }
        ]
    },
    {
        name: "Realm 3: The Astral Citadel",
        isBossLevel: false,
        bgGradient: ["#18052b", "#31054a"],
        primaryColor: "#701a75",
        secondaryColor: "#4a044e",
        portalX: 2200, portalY: 320,
        platforms: [
            { x: 0, y: 400, width: 500, height: 50 },
            { x: 600, y: 300, width: 100, height: 15 },
            { x: 800, y: 220, width: 100, height: 15 },
            { x: 1000, y: 320, width: 100, height: 15 },
            { x: 1200, y: 400, width: 400, height: 50 },
            { x: 1350, y: 250, width: 200, height: 15 },
            { x: 1700, y: 280, width: 150, height: 15 },
            { x: 1950, y: 200, width: 150, height: 15 },
            { x: 2150, y: 400, width: 300, height: 50 }
        ],
        crystals: [
            { x: 640, y: 250, width: 16, height: 20, collected: false },
            { x: 840, y: 170, width: 16, height: 20, collected: false },
            { x: 1040, y: 270, width: 16, height: 20, collected: false },
            { x: 1400, y: 200, width: 16, height: 20, collected: false },
            { x: 1750, y: 230, width: 16, height: 20, collected: false }
        ],
        enemies: [
            { x: 200, y: 368, width: 24, height: 32, minX: 80, maxX: 450, speed: 2.5, alive: true },
            { x: 1300, y: 368, width: 24, height: 32, minX: 1210, maxX: 1550, speed: 2.5, alive: true },
            { x: 2250, y: 368, width: 24, height: 32, minX: 2160, maxX: 2400, speed: 3.0, alive: true }
        ]
    },
    {
        name: "Final Realm: Gorgon's Lair",
        isBossLevel: true,
        bgGradient: ["#2d0505", "#140101"],
        primaryColor: "#dc2626",
        secondaryColor: "#7f1d1d",
        platforms: [
            { x: 0, y: 400, width: 900, height: 50 },
            { x: 200, y: 290, width: 200, height: 15 },
            { x: 500, y: 230, width: 200, height: 15 }
        ],
        crystals: [],
        enemies: []
    }
];

let activeLevel = levelData[currentLevelIndex];
let spells = [];
let particles = [];
let enemyProjectiles = [];

// --- BOSS STATE INSTANCE ---
const boss = {
    x: 750, y: 150, width: 64, height: 90,
    maxHp: 10, hp: 10,
    shootCooldown: 0, hoverTime: 0, basePosition: 150, alive: true
};

// --- KEYBOARD HANDLING WITH FOCUS/SCROLL PREVENTION ---
window.addEventListener("keydown", e => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "KeyW", "KeyA", "KeyS", "KeyD"].includes(e.code)) {
        e.preventDefault();
    }
    if (e.code === "ArrowRight" || e.code === "KeyD") inputs.right = true;
    if (e.code === "ArrowLeft" || e.code === "KeyA") inputs.left = true;
    if (e.code === "ArrowUp" || e.code === "KeyW") inputs.jump = true;
    if (e.code === "Space") inputs.magic = true;
});

window.addEventListener("keyup", e => {
    if (e.code === "ArrowRight" || e.code === "KeyD") inputs.right = false;
    if (e.code === "ArrowLeft" || e.code === "KeyA") inputs.left = false;
    if (e.code === "ArrowUp" || e.code === "KeyW") inputs.jump = false;
    if (e.code === "Space") inputs.magic = false;
});

window.addEventListener("blur", () => {
    inputs.left = false; inputs.right = false; inputs.jump = false; inputs.magic = false;
});

// --- POINTER HANDLING ---
const buttons = document.querySelectorAll('.btn');
buttons.forEach(btn => {
    const inputAction = btn.getAttribute('data-input');
    if (!inputAction) return;

    btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        inputs[inputAction] = true;
        btn.setPointerCapture(e.pointerId);
    }, { passive: false });

    btn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        inputs[inputAction] = false;
        try { btn.releasePointerCapture(e.pointerId); } catch(err) {}
    }, { passive: false });

    btn.addEventListener('pointercancel', (e) => {
        e.preventDefault();
        inputs[inputAction] = false;
        try { btn.releasePointerCapture(e.pointerId); } catch(err) {}
    }, { passive: false });
});

const triggerResetOrReload = () => {
    if (gameOver || gameWon) {
        window.location.reload();
    }
};
canvas.addEventListener("click", triggerResetOrReload);

// --- LEVEL MANAGER ---
function loadLevel(index) {
    if (index >= levelData.length) {
        gameWon = true;
        return;
    }
    currentLevelIndex = index;
    activeLevel = levelData[currentLevelIndex];
    score = 0;
    
    wizard.x = 100;
    wizard.y = 200;
    wizard.vx = 0;
    wizard.vy = 0;
    wizard.isGrounded = false;
    
    spells = [];
    particles = [];
    enemyProjectiles = [];

    if (activeLevel.isBossLevel) {
        boss.hp = boss.maxHp;
        boss.alive = true;
        boss.shootCooldown = 0;
        levelDisplay.innerText = activeLevel.name;
        objectiveDisplay.innerHTML = "BOSS HP: <span id='scoreDisplay'>10</span>";
    } else {
        levelDisplay.innerText = activeLevel.name;
        objectiveDisplay.innerHTML = "Crystals: <span id='scoreDisplay'>0/" + activeLevel.crystals.length + "</span>";
    }
}

// --- PLAYER OBJECT ---
const wizard = {
    x: 100, y: 200, width: 32, height: 48, vx: 0, vy: 0,
    isGrounded: false, facing: "right", color: "#8b5cf6", hatColor: "#4c1d95", cooldown: false,

    update() {
        if (inputs.right) { this.vx = PLAYER_SPEED; this.facing = "right"; }
        else if (inputs.left) { this.vx = -PLAYER_SPEED; this.facing = "left"; }
        else { this.vx = 0; }

        if (inputs.jump && this.isGrounded) {
            this.vy = JUMP_FORCE;
            this.isGrounded = false;
        }

        if (inputs.magic && !this.cooldown) {
            castSpell();
            this.cooldown = true;
            setTimeout(() => this.cooldown = false, 300);
        }

        this.vy += GRAVITY;

        this.x += this.vx;
        if (this.x < 0) this.x = 0;
        this.resolveCollisions("horizontal");

        this.y += this.vy;
        this.isGrounded = false;
        this.resolveCollisions("vertical");
    },

    resolveCollisions(axis) {
        activeLevel.platforms.forEach(platform => {
            if (checkAABBCollision(this, platform)) {
                if (axis === "horizontal") {
                    if (this.vx > 0) this.x = platform.x - this.width;
                    else if (this.vx < 0) this.x = platform.x + platform.width;
                } else if (axis === "vertical") {
                    if (this.vy > 0) {
                        this.y = platform.y - this.height;
                        this.vy = 0;
                        this.isGrounded = true;
                    } else if (this.vy < 0) {
                        this.y = platform.y + platform.height;
                        this.vy = 0;
                    }
                }
            }
        });
    },

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.color;
        ctx.fillRect(0, 16, this.width, this.height - 16);
        ctx.fillStyle = "#ffdbac";
        ctx.fillRect(6, 8, this.width - 12, 12);
        ctx.fillStyle = this.hatColor;
        ctx.beginPath(); ctx.moveTo(-4, 12); ctx.lineTo(this.width + 4, 12); ctx.lineTo(this.width / 2, -4); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#fbbf24"; ctx.fillRect(this.width / 2 - 3, 7, 6, 5);
        ctx.fillStyle = "#000";
        if (this.facing === "right") {
            ctx.fillRect(this.width - 12, 12, 3, 3);
            ctx.fillStyle = "#78350f"; ctx.fillRect(this.width, 18, 4, 24);
            ctx.fillStyle = "#6ee7b7"; ctx.beginPath(); ctx.arc(this.width + 2, 16, 4, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillRect(9, 12, 3, 3);
            ctx.fillStyle = "#78350f"; ctx.fillRect(-4, 18, 4, 24);
            ctx.fillStyle = "#6ee7b7"; ctx.beginPath(); ctx.arc(-2, 16, 4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }
};

// --- SPELLS ARCHITECTURE ---
function castSpell() {
    spells.push({
        x: wizard.facing === "right" ? wizard.x + wizard.width + 5 : wizard.x - 15,
        y: wizard.y + 20,
        vx: wizard.facing === "right" ? 7 : -7,
        width: 10, height: 10, life: 60
    });
}

function createBurst(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
            radius: Math.random() * 3 + 1, color: color, alpha: 1, decay: Math.random() * 0.03 + 0.02
        });
    }
}

function checkAABBCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y;
}

function processInteractions() {
    // Regular Level Loop Interactions
    if (!activeLevel.isBossLevel) {
        activeLevel.crystals.forEach(crystal => {
            if (!crystal.collected && checkAABBCollision(wizard, crystal)) {
                crystal.collected = true;
                score++;
                document.getElementById("scoreDisplay").innerText = `${score}/${activeLevel.crystals.length}`;
                createBurst(crystal.x + 8, crystal.y + 10, "#00ffff");
            }
        });

        activeLevel.enemies.forEach(enemy => {
            if (!enemy.alive) return;
            if (checkAABBCollision(wizard, enemy)) gameOver = true;
            
            spells.forEach((spell, sIdx) => {
                if (checkAABBCollision(spell, enemy)) {
                    enemy.alive = false;
                    spells.splice(sIdx, 1);
                    createBurst(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, "#ef4444", 16);
                }
            });
        });

        if (score >= activeLevel.crystals.length) {
            const portalRect = { x: activeLevel.portalX, y: activeLevel.portalY, width: 40, height: 70 };
            if (checkAABBCollision(wizard, portalRect)) {
                createBurst(portalRect.x + 20, portalRect.y + 35, "#a855f7", 30);
                loadLevel(currentLevelIndex + 1);
            }
        }
    } 
    // Boss Level Logic Loop Interactions
    else if (activeLevel.isBossLevel && boss.alive) {
        if (checkAABBCollision(wizard, boss)) gameOver = true;

        enemyProjectiles.forEach(proj => {
            if (checkAABBCollision(wizard, proj)) gameOver = true;
        });

        spells.forEach((spell, sIdx) => {
            if (checkAABBCollision(spell, boss)) {
                boss.hp--;
                spells.splice(sIdx, 1);
                createBurst(boss.x + 10, spell.y, "#ff3333", 8);
                document.getElementById("scoreDisplay").innerText = boss.hp;
                
                if (boss.hp <= 0) {
                    boss.alive = false;
                    createBurst(boss.x + 32, boss.y + 45, "#ef4444", 50);
                    createBurst(boss.x + 32, boss.y + 45, "#fbbf24", 50);
                    setTimeout(() => { gameWon = true; }, 1000);
                }
            }
        });
    }

    if (wizard.y > canvas.height + 100) gameOver = true;
}

// --- ENGINE REFRESH LOOP ---
function update() {
    if (gameOver || gameWon) return;

    wizard.update();

    if (!activeLevel.isBossLevel) {
        activeLevel.enemies.forEach(e => {
            if (!e.alive) return;
            e.x += e.speed;
            if (e.x <= e.minX || e.x + e.width >= e.maxX) e.speed = -e.speed;
        });
    } else if (boss.alive) {
        // Floating hover motion
        boss.hoverTime += 0.04;
        boss.y = boss.basePosition + Math.sin(boss.hoverTime) * 40;

        // Auto Attack sequence
        boss.shootCooldown++;
        if (boss.shootCooldown >= 90) { // Fires every 1.5 seconds
            enemyProjectiles.push({
                x: boss.x - 15,
                y: boss.y + 35,
                vx: -5,
                width: 16, height: 16
            });
            boss.shootCooldown = 0;
        }
    }

    processInteractions();

    camera.x = wizard.x - canvas.width / 2 + wizard.width / 2;
    if (camera.x < 0) camera.x = 0;
    // Cap camera to stop scroll past boss arena
    if (activeLevel.isBossLevel && camera.x > 150) camera.x = 150; 

    // Update Player Magic
    for (let i = spells.length - 1; i >= 0; i--) {
        let s = spells[i]; s.x += s.vx; s.life--;
        if (Math.random() > 0.4) {
            particles.push({
                x: s.x + 5, y: s.y + 5, vx: (Math.random() - 0.5) * 1, vy: (Math.random() - 0.5) * 1,
                radius: Math.random() * 2 + 1, color: "#6ee7b7", alpha: 0.8, decay: 0.04
            });
        }
        if (s.life <= 0) spells.splice(i, 1);
    }

    // Update Enemy Projectiles
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        let ep = enemyProjectiles[i];
        ep.x += ep.vx;
        if (Math.random() > 0.5) {
            particles.push({
                x: ep.x + 8, y: ep.y + 8, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5,
                radius: Math.random() * 3 + 1, color: "#ec4899", alpha: 0.7, decay: 0.05
            });
        }
        if (ep.x < 0) enemyProjectiles.splice(i, 1);
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
    }
}

function draw() {
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, activeLevel.bgGradient[0]);
    gradient.addColorStop(1, activeLevel.bgGradient[1]);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x, 0);

    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    for (let i = 0; i < 30; i++) {
        ctx.fillRect((i * 135) % 2500, 40 + (i % 4) * 50, 2, 2);
    }

    activeLevel.platforms.forEach(p => {
        ctx.fillStyle = activeLevel.primaryColor; ctx.fillRect(p.x, p.y, p.width, 6);
        ctx.fillStyle = activeLevel.secondaryColor; ctx.fillRect(p.x, p.y + 6, p.width, p.height - 6);
    });

    if (!activeLevel.isBossLevel) {
        // Crystals
        activeLevel.crystals.forEach(c => {
            if (!c.collected) {
                ctx.fillStyle = "#22d3ee";
                let hover = Math.sin(Date.now() * 0.005) * 4;
                ctx.beginPath();
                ctx.moveTo(c.x + c.width / 2, c.y + hover);
                ctx.lineTo(c.x + c.width, c.y + c.height / 2 + hover);
                ctx.lineTo(c.x + c.width / 2, c.y + c.height + hover);
                ctx.lineTo(c.x, c.y + c.height / 2 + hover);
                ctx.closePath(); ctx.fill();
            }
        });

        // Portal Gate
        if (score >= activeLevel.crystals.length) {
            ctx.save();
            ctx.translate(activeLevel.portalX, activeLevel.portalY);
            let pulseFactor = 1 + Math.sin(Date.now() * 0.01) * 0.1;
            let pGrad = ctx.createRadialGradient(20, 35, 2, 20, 35, 35 * pulseFactor);
            pGrad.addColorStop(0, "#c084fc"); pGrad.addColorStop(0.5, "#7e22ce"); pGrad.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = pGrad; ctx.beginPath(); ctx.ellipse(20, 35, 20 * pulseFactor, 35 * pulseFactor, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        // Standard Enemies
        activeLevel.enemies.forEach(e => {
            if (!e.alive) return;
            ctx.save(); ctx.translate(e.x, e.y);
            ctx.fillStyle = "#1e1b4b"; ctx.fillRect(0, 8, e.width, e.height - 8);
            ctx.fillStyle = "#311042"; ctx.fillRect(2, 0, e.width - 4, 10);
            ctx.fillStyle = "#f87171";
            if (e.speed > 0) { ctx.fillRect(e.width - 7, 4, 3, 3); ctx.fillRect(e.width - 12, 4, 3, 3); } 
            else { ctx.fillRect(4, 4, 3, 3); ctx.fillRect(9, 4, 3, 3); }
            ctx.restore();
        });
    } else if (boss.alive) {
        // --- DRAW FINAL BOSS ---
        ctx.save();
        ctx.translate(boss.x, boss.y);
        
        // Health Bar Overlay Layout
        ctx.fillStyle = "#450a0a"; ctx.fillRect(-10, -20, 84, 8);
        ctx.fillStyle = "#ef4444"; ctx.fillRect(-10, -20, 84 * (boss.hp / boss.maxHp), 8);
        
        // Enemy Body Parts
        ctx.fillStyle = "#111827"; ctx.fillRect(0, 20, boss.width, boss.height - 20); // Cloak
        ctx.fillStyle = "#065f46"; ctx.fillRect(12, 0, boss.width - 24, 25); // Daemon Head
        
        // Glowing Eyes
        let eyePulse = Math.sin(Date.now() * 0.02) * 2;
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath(); ctx.arc(22, 10, 4 + eyePulse / 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(42, 10, 4 + eyePulse / 2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    // Spells & Projectiles
    ctx.fillStyle = "#6ee7b7";
    spells.forEach(s => ctx.fillRect(s.x, s.y, s.width, s.height));

    enemyProjectiles.forEach(ep => {
        ctx.fillStyle = "#f472b6";
        ctx.beginPath(); ctx.arc(ep.x + 8, ep.y + 8, 8, 0, Math.PI * 2); ctx.fill();
    });

    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    wizard.draw();
    ctx.restore();

    if (gameOver || gameWon) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = gameOver ? "#f87171" : "#34d399";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(gameOver ? "GAME OVER" : "ALL REALMS SAVED!", canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = "#a78bfa";
        ctx.font = "16px sans-serif";
        ctx.fillText("Click or tap the screen to try again", canvas.width / 2, canvas.height / 2 + 30);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loadLevel(0);
loop();
</script>
